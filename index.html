<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beenshub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Set favicon -->
    <link rel="icon" href="/images/B.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom, #1e3c72, #2a5298);
            color: white;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .drop {
            position: absolute;
            bottom: 100%;
            width: 3px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .sidebar {
            position: relative;
            z-index: 2;
            background-color: #69a8db; /* Sidebar color */
            width: 80px; /* Fixed width for sidebar */
            height: 100vh; /* Full height for sidebar */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 1rem; /* Top padding */
            border-radius: 0 20px 20px 0; /* Rounded corners */
        }

        .sidebar a {
            color: #fff; /* White icon color */
            text-decoration: none; /* Remove underline */
            display: block; /* Block display */
            margin: 1.5rem 0; /* Spacing for sidebar items */
            text-align: center; /* Center the icon */
        }

        .sidebar .bi {
            font-size: 2rem; /* Font size for icons */
            cursor: pointer;
        }

        .logo-area {
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        /* Replace "V" text with image */
        .logo-v {
            width: 150px;  /* Set the width for the image */
            height: auto;  /* Maintain aspect ratio */
            background: none; /* Remove background gradient */
        }

        .logo-text {
            font-size: 1.5rem;
            color: #9dc1ff;
            font-weight: 600;
            margin-top: -30px;
        }

        .links-box {
            position: absolute;
            z-index: 2;
            right: 30px;
            top: 30%;
            background-color: #84c2f4;
            padding: 30px;
            border-radius: 20px;
            color: #000;
            width: 230px;
            font-weight: bold;
        }

        .links-box a {
            display: block;
            color: #000;
            margin-top: 10px;
            text-decoration: none;
        }

        .cart-icon {
            display: none;
        }
    </style>
</head>
<body>

    <div class="rain" id="rain"></div>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="/"><i class="bi bi-house-door-fill"></i></a> <!-- Home link -->
        <a href="/tutorials"><i class="bi bi-tv"></i></a> <!-- AI link -->
        <a href="/games"><i class="bi bi-controller"></i></a> <!-- Game link -->
        <a href="/apps"><i class="bi bi-grid"></i></a> <!-- Apps link -->
        <a href="/search"><i class="bi bi-search"></i></a> <!-- Search link -->
    </div>

    <div class="logo-area">
        <!-- Replace V with image -->
        <img src="/images/B.png" class="logo-v" alt="Logo">
        <div class="logo-text">BEENSHUB</div>
    </div>

    <div class="links-box">
        <div class="mb-2">LINKS!</div>
        <a href="https://example1.com">https://example1.com</a>
        <a href="https://example2.com">https://example2.com</a>
        <a href="https://example3.com">https://example3.com</a>
        <div class="note">LINKS COME WHEN ALL GET BLOCKED</div>
    </div>

    <script>
        const rainContainer = document.getElementById('rain');
        const numDrops = 120;

        for (let i = 0; i < numDrops; i++) {
            const drop = document.createElement('div');
            drop.classList.add('drop');
            drop.style.left = `${Math.random() * 100}%`;
            drop.style.animationDuration = `${0.5 + Math.random() * 1.5}s`;
            drop.style.animationDelay = `${Math.random() * 2}s`;
            rainContainer.appendChild(drop);
        }
    </script>

</body>
</html>

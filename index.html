<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beenshub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="icon" href="/images/B2.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom, #1e3c72, #2a5298);
            color: white;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .drop {
            position: absolute;
            bottom: 100%;
            width: 3px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .sidebar {
            position: relative;
            z-index: 2;
            background-color: #69a8db;
            width: 80px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 1rem;
            border-radius: 0 20px 20px 0;
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            display: block;
            margin: 1.5rem 0;
            text-align: center;
        }

        .sidebar .bi {
            font-size: 2rem;
            cursor: pointer;
        }

        .logo-area {
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-text {
            font-size: 4rem;
            color: blue;
            font-weight: bold;
            margin-top: 20px;
        }

        .links-box {
            position: absolute;
            z-index: 2;
            right: 30px;
            top: 30%;
            background-color: #84c2f4;
            padding: 30px;
            border-radius: 20px;
            color: #000;
            width: 230px;
            font-weight: bold;
        }

        .links-box a {
            display: block;
            color: #000;
            margin-top: 10px;
            text-decoration: none;
        }

        .popup {
            position: absolute;
            top: 20px;
            left: -350px;
            width: 300px;
            background-color: #007BFF;
            border: 2px solid #0056b3;
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 3;
            transition: transform 0.5s ease-in-out;
        }

        .popup.show {
            transform: translateX(350px);
        }

        .popup.hide {
            transform: translateX(-350px);
        }

        .cart-icon {
            display: none;
        }
    </style>
</head>
<body>

    <div class="rain" id="rain"></div>

    <div class="sidebar">
        <a href="/"><i class="bi bi-house-door-fill"></i></a>
        <a href="/tutorials"><i class="bi bi-tv"></i></a>
        <a href="/games"><i class="bi bi-controller"></i></a>
        <a href="/apps"><i class="bi bi-grid"></i></a>
        <a href="/search"><i class="bi bi-search"></i></a>
    </div>

    <div class="logo-area">
        <div class="logo-text">BH</div>
    </div>

    <div class="links-box">
        <div class="mb-2">LINKS!</div>
        <a href="https://example1.com">https://example1.com</a>
        <a href="https://example2.com">https://example2.com</a>
        <a href="https://example3.com">https://example3.com</a>
        <div class="note">LINKS COME WHEN ALL GET BLOCKED</div>
    </div>

    <div class="popup" id="popup">Hate me all you want but I'm back, no AI this time</div>

    <script>
        const rainContainer = document.getElementById('rain');
        const numDrops = 120;

        for (let i = 0; i < numDrops; i++) {
            const drop = document.createElement('div');
            drop.classList.add('drop');
            drop.style.left = `${Math.random() * 100}%`;
            drop.style.animationDuration = `${0.5 + Math.random() * 1.5}s`;
            drop.style.animationDelay = `${Math.random() * 2}s`;
            rainContainer.appendChild(drop);
        }

        const popup = document.getElementById('popup');
        popup.classList.add('show');

        setTimeout(() => {
            popup.classList.add('hide');
        }, 3000);
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beenshub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #1e3c72, #2a5298);
      color: white;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    .rain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .drop {
      position: absolute;
      bottom: 100%;
      width: 1px;
      height: 80px;
      background: rgba(255, 255, 255, 0.1);
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(100vh);
        opacity: 0;
      }
    }

    .sidebar {
      position: relative;
      z-index: 2;
      background-color: #69a8db;
      width: 80px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 1rem;
      border-radius: 0 20px 20px 0;
    }

    .sidebar .bi {
      font-size: 1.8rem;
      margin: 1.5rem 0;
      color: #fff;
      cursor: pointer;
    }

    .logo-area {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .logo-v {
      font-size: 150px;
      font-weight: bold;
      background: linear-gradient(45deg, #8e8dfd, #60f4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-text {
      font-size: 1.5rem;
      color: #9dc1ff;
      font-weight: 600;
      margin-top: -30px;
    }

    .links-box {
      position: absolute;
      z-index: 2;
      right: 30px;
      top: 30%;
      background-color: #84c2f4;
      padding: 30px;
      border-radius: 20px;
      color: #000;
      width: 230px;
      font-weight: bold;
    }

    .links-box a {
      display: block;
      color: #000;
      margin-top: 10px;
      text-decoration: none;
    }

    .cart-icon {
      display: none;
    }
  </style>
</head>
<body>

  <div class="rain" id="rain"></div>

  <div class="sidebar">
    <a href="https://example.com"><i class="bi bi-house-door-fill"></i></a> <!-- Home Icon -->
    <a href="/ai"><i class="bi bi-robot"></i></a> <!-- AI Icon -->
    <a href="https://example.com/games"><i class="bi bi-controller"></i></a> <!-- Game Icon -->
    <a href="https://example.com/apps"><i class="bi bi-clock"></i></a> <!-- Apps Icon -->
    <a href="https://example.com/search"><i class="bi bi-search"></i></a> <!-- Search Icon -->
  </div>

  <div class="logo-area">
    <div class="logo-v">V</div>
    <div class="logo-text">BEENSHUB</div>
  </div>

  <div class="links-box">
    <div class="mb-2">LINKS!</div>
    <a href="https://example.com">https://example.com</a>
    <a href="https://example.com/"> Us</a>
    <a href="https://example.com/contact"></a>
    <div class="note">LINKS COME WHEN ALL GET BLOCKED</div>
  </div>

  <script>
    const rainContainer = document.getElementById('rain');
    const numDrops = 120;

    for (let i = 0; i < numDrops; i++) {
      const drop = document.createElement('div');
      drop.classList.add('drop');
      drop.style.left = `${Math.random() * 100}%`;
      drop.style.animationDuration = `${0.5 + Math.random() * 1.5}s`;
      drop.style.animationDelay = `${Math.random() * 2}s`;
      rainContainer.appendChild(drop);
    }
  </script>

</body>
</html>

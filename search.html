<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <script>
        function redirect() {
            const input = document.getElementById('input').value.trim();
            let redirectUrl = '';

            if (input.startsWith('https://')) {
                redirectUrl = `/active/embed.html?url=${encodeURIComponent(input)}`;
            } else {
                const searchUrl = `https://duckduckgo.com/?t=h_&q=${encodeURIComponent(input)}&ia=web`;
                redirectUrl = `/active/embed.html?url=${encodeURIComponent(searchUrl)}`;
            }

            window.location.href = redirectUrl;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                redirect();
            }
        }
    </script>
    <style>
        body {
            background-color: #000; /* Set a solid background */
            color: #ffffff; /* White text color */
        }

        .sidebar {
            background-color: #69a8db; /* Sidebar color */
            height: 100vh; /* Full height for sidebar */
        }

        .sidebar a {
            color: #fff; /* White icon color */
            text-decoration: none;
            text-align: center;
            font-size: 1.5rem; /* Font size for icons */
            padding: 15px 0; /* Spacing for sidebar items */
            display: block;
        }

        .sidebar a:hover {
            background-color: rgba(255, 255, 255, 0.1); /* Highlight on hover */
        }

        h2 {
            margin-top: 80px; /* Space below the navbar */
            text-align: center; /* Center the heading */
        }

        input {
            width: 100%; /* Full-width input */
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        button {
            margin-top: 10px;
            width: 100%; /* Full-width button */
            padding: 10px;
            font-size: 16px;
            background: linear-gradient(135deg, #ffcc00, #ff7f30); /* Button gradient */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #ff7f30; /* Darker orange on hover */
        }
    </style>
</head>

<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar flex-shrink-0">
            <nav class="nav flex-column">
                <a href="/index" class="nav-link"><i class="bi bi-house-door-fill"></i> Home</a>
                <a href="/ai" class="nav-link"><i class="bi bi-robot"></i> AI</a>
                <a href="/games" class="nav-link"><i class="bi bi-controller"></i> Games</a>
                <a href="/apps" class="nav-link"><i class="bi bi-grid"></i> Apps</a>
                <a href="/sports" class="nav-link"><i class="bi bi-trophy"></i> Sports</a>
                <a href="/search" class="nav-link"><i class="bi bi-search"></i> Pro_y</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1">
            <nav class="nav bg-dark text-white p-2">
                <a href="/index" class="nav-link text-white"><i class="bi bi-house-door-fill"></i> Home</a>
                <a href="/ai" class="nav-link text-white"><i class="bi bi-robot"></i> AI</a>
                <a href="/games" class="nav-link text-white"><i class="bi bi-controller"></i> Games</a>
                <a href="/apps" class="nav-link text-white"><i class="bi bi-grid"></i> Apps</a>
                <a href="/search" class="nav-link text-white"><i class="bi bi-search"></i> Pro_y</a>
            </nav>

            <h2>Type a URL (https://...) or a Search Query</h2>
            <input type="text" id="input" onkeypress="handleKeyPress(event)" placeholder="Enter URL or search..." />
            <button onclick="redirect()">Go</button>
        </div>
    </div>

    <!-- Bootstrap JS (Optional) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>

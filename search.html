<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(to bottom, #1e3c72, #2a5298);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        .sidebar {
            background-color: #69a8db;
            height: 100vh;
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 1rem;
            border-radius: 0 20px 20px 0;
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            text-align: center;
            font-size: 2rem;
            margin: 1.5rem 0;
        }

        .sidebar a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .main-content {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background: linear-gradient(135deg, #69a8db, #69a8db);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #ff7f30;
        }

        .popup {
            position: absolute;
            top: 20px;
            left: -350px;
            width: 300px;
            background-color: #007BFF;
            border: 2px solid #0056b3;
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 3;
            transition: transform 0.5s ease-in-out;
        }

        .popup.show {
            transform: translateX(350px);
        }

        .popup.hide {
            transform: translateX(-350px);
        }
    </style>
    <script>
        function redirect() {
            const input = document.getElementById('input').value.trim();
            let redirectUrl = '';

            if (input.startsWith('https://')) {
                redirectUrl = `/active/embed.html?url=${encodeURIComponent(input)}`;
            } else {
                const searchUrl = `https://duckduckgo.com/?t=h_&q=${encodeURIComponent(input)}&ia=web`;
                redirectUrl = `/active/embed.html?url=${encodeURIComponent(searchUrl)}`;
            }

            window.location.href = redirectUrl;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                redirect();
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const popup = document.createElement('div');
            popup.classList.add('popup');
            popup.id = 'popup';
            popup.textContent = "Hate me all you want but I'm back, no AI this time";
            document.body.appendChild(popup);
            popup.classList.add('show');

            setTimeout(() => {
                popup.classList.add('hide');
            }, 3000);
        });
    </script>
</head>

<body>
    <div class="sidebar">
        <a href="/"><i class="bi bi-house-door-fill"></i></a>
        <a href="/tutorials"><i class="bi bi-tv"></i></a>
        <a href="/games.html"><i class="bi bi-controller"></i></a>
        <a href="/apps.html"><i class="bi bi-grid"></i></a>
        <a href="/search.html"><i class="bi bi-search"></i></a>
    </div>

    <div class="main-content">
        <input type="text" id="input" onkeypress="handleKeyPress(event)" placeholder="Enter URL or search..." />
        <button onclick="redirect()">Go</button>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <script>
        function redirect() {
            const input = document.getElementById('input').value.trim();
            let redirectUrl = '';

            if (input.startsWith('https://')) {
                redirectUrl = `/active/embed.html?url=${encodeURIComponent(input)}`;
            } else {
                const searchUrl = `https://duckduckgo.com/?t=h_&q=${encodeURIComponent(input)}&ia=web`;
                redirectUrl = `/active/embed.html?url=${encodeURIComponent(searchUrl)}`;
            }

            window.location.href = redirectUrl;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                redirect();
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(to bottom, #007bff, #0056b3);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        .sidebar {
            background-color: #69a8db;
            height: 100vh;
            width: 80px;
        }

        .sidebar a {
            color: #fff;
            text-decoration: none;
            text-align: center;
            font-size: 1.5rem;
            padding: 15px 0;
            display: block;
        }

        .sidebar a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .main-content {
            flex-grow: 1;
            padding: 20px;
        }

        h2 {
            margin-top: 50px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background: linear-gradient(135deg, #69a8db, #69a8db);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #ff7f30;
        }
    </style>
</head>

<body>
    <div class="sidebar flex-shrink-0">
        <nav class="nav flex-column">
            <a href="/index" class="nav-link"><i class="bi bi-house-door-fill"></i> Home</a>
            <a href="/tutorials" class="nav-link"><i class="bi bi-tv"></i> AI</a>
            <a href="/games.html" class="nav-link"><i class="bi bi-controller"></i> Games</a>
            <a href="/apps.html" class="nav-link"><i class="bi bi-grid"></i> Apps</a>
            <a href="/search.html" class="nav-link"><i class="bi bi-search"></i> Pro_y</a>
        </nav>
    </div>

    <div class="main-content">
        <h2>Type a URL (https://...) or a Search Query</h2>
        <input type="text" id="input" onkeypress="handleKeyPress(event)" placeholder="Enter URL or search..." />
        <button onclick="redirect()">Go</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
